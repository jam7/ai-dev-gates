# What the commit gate measures in this project. Sourced by .githooks/pre-commit.
#
# This file is yours: install.sh creates it when it is missing and never
# replaces it, so updating the hooks cannot reset what you configured here.
# Shell syntax, since the hook sources it -- assignments only, no commands.

# Extensions the structure check measures, comma separated. Empty measures
# every language cq-metrics.py knows. Narrowing it to the production language
# keeps a docs-only commit instant.
ext=".py"

# Directories it measures, space separated. Empty measures the whole
# repository, which is usually worth narrowing: generated trees, vendored
# code and deliberately awkward test fixtures all drown the signal.
scope=".claude/skills tools"

# Anything else to run before a commit, as a shell command, from the
# repository root. It runs only when the commit touches a file matching ext.
# A non-zero exit blocks the commit, the same as the checks above.
#
#   extra_checks="python3 tests/run.py"
extra_checks="python3 tests/run.py"

# Declared: this repository has no denylist. Its content is invented
# fixtures and documentation; the real-name lists live in the private notes
# of the projects that own the data (na, image-viewer). A readable empty
# file is the deliberate "none" -- without this line, every commit would
# rightly notice that the default denylist is absent.
private_args="--denylist /dev/null"

# Prose textlint checks (tools/check-text.py). Skips with a notice where
# textlint is not installed -- writing quality only, nothing protective.
# tests/fixtures/ is excluded: fixtures are deliberate content, and fixing
# their prose would change the golden outputs they exist to pin.
text_scope="^(?!tests/fixtures/).*\.md$"
